<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anduin Setup</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
  <style>
    :root {
      --color-paper: #F6F4EE;
      --color-stone: #1B1B1F;
      --color-slate: #4A4E55;
      --color-navy: #0E1B2E;
      --color-border: #E5E2D9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: "Geist Sans", -apple-system, sans-serif;
      background: var(--color-paper);
      color: var(--color-stone);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wizard-card {
      width: 400px;
      text-align: center;
      animation: slideIn 0.25s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .wizard-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-border);
      transition: all 0.3s;
    }
    .dot.active {
      background: var(--color-navy);
      transform: scale(1.25);
    }
    .dot.done {
      background: var(--color-navy);
    }

    .wizard-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--color-navy);
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    .wizard-subtitle {
      font-size: 13px;
      color: var(--color-slate);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .info-card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
      text-align: left;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }
    .info-label {
      font-size: 13px;
      color: var(--color-slate);
    }
    .info-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-stone);
    }

    .progress-bar-container {
      background: var(--color-border);
      border-radius: 6px;
      height: 6px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--color-navy);
      border-radius: 6px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 12px;
      color: var(--color-slate);
      min-height: 18px;
    }

    .wizard-btn {
      display: inline-block;
      padding: 12px 40px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      background: var(--color-navy);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 8px;
    }
    .wizard-btn:hover { opacity: 0.9; }
    .wizard-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .wizard-btn-secondary {
      background: transparent;
      color: var(--color-slate);
      font-weight: 600;
      font-size: 12px;
      padding: 8px 20px;
      margin-top: 12px;
    }
    .wizard-btn-secondary:hover {
      color: var(--color-stone);
      opacity: 1;
    }

    .wizard-btn-large {
      font-size: 16px;
      padding: 16px 56px;
      border-radius: 12px;
    }

    .step { display: none; }
    .step.active { display: block; }

    .error-text {
      color: #ff3b30;
      font-size: 12px;
      margin-top: 8px;
    }

    .status-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="wizard-card">
  <div class="wizard-dots" id="dots"></div>

  <!-- Step 0: Welcome -->
  <div class="step active" id="step-0">
    <div class="wizard-title">Welcome to Anduin</div>
    <div class="wizard-subtitle">We detected your hardware and selected<br>the best models for your machine.</div>
    <div class="info-card" id="hw-info"></div>
    <button class="wizard-btn" onclick="goNext()">Continue</button>
  </div>

  <!-- Step 1: Whisper -->
  <div class="step" id="step-1">
    <div class="wizard-title">Downloading Whisper</div>
    <div class="wizard-subtitle" id="whisper-subtitle"></div>
    <div class="progress-bar-container"><div class="progress-bar-fill" id="whisper-progress"></div></div>
    <div class="progress-text" id="whisper-status"></div>
    <button class="wizard-btn" id="whisper-btn" disabled onclick="goNext()">Downloading…</button>
  </div>

  <!-- Step 2: Ollama -->
  <div class="step" id="step-2">
    <div class="wizard-title">Downloading LLM</div>
    <div class="wizard-subtitle" id="ollama-subtitle"></div>
    <div id="ollama-install-prompt" style="display:none">
      <div class="progress-text" id="ollama-detect-status">Checking for Ollama…</div>
      <button class="wizard-btn" id="ollama-download-btn">Download Ollama</button>
      <br>
      <button class="wizard-btn wizard-btn-secondary" id="ollama-recheck-btn">I've installed it</button>
    </div>
    <div id="ollama-progress-area" style="display:none">
      <div class="progress-bar-container"><div class="progress-bar-fill" id="ollama-progress"></div></div>
      <div class="progress-text" id="ollama-status"></div>
    </div>
    <button class="wizard-btn" id="ollama-btn" disabled onclick="goNext()" style="display:none">Downloading…</button>
  </div>

  <!-- Step 3: Permissions -->
  <div class="step" id="step-3">
    <div class="wizard-title">Screen Recording</div>
    <div class="wizard-subtitle">Required for digital meetings.<br>Only audio is captured, no screen content.</div>
    <button class="wizard-btn" id="perm-btn" onclick="requestPermission()">Grant Permission</button>
    <br>
    <button class="wizard-btn wizard-btn-secondary" onclick="goNext()">Skip for now</button>
    <div class="progress-text" id="perm-status" style="margin-top:12px"></div>
  </div>

  <!-- Step 4: Done -->
  <div class="step" id="step-4">
    <div class="wizard-title" style="margin-top:20px">Ready to go</div>
    <div class="wizard-subtitle">Anduin will appear in your menu bar.</div>
    <button class="wizard-btn wizard-btn-large" onclick="launch()">Launch Anduin</button>
  </div>
</div>

<script>
const TOTAL_STEPS = 5;
let currentStep = 0;

function renderDots() {
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  for (let i = 0; i < TOTAL_STEPS; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < currentStep ? " done" : "") + (i === currentStep ? " active" : "");
    dots.appendChild(d);
  }
}

function showStep(n) {
  document.querySelectorAll(".step").forEach((s, i) => {
    s.classList.toggle("active", i === n);
  });
  currentStep = n;
  renderDots();

  // Trigger step logic
  if (n === 0) initHardware();
  if (n === 1) initWhisper();
  if (n === 2) initOllama();
}

function goNext() {
  if (currentStep < TOTAL_STEPS - 1) {
    showStep(currentStep + 1);
  }
}

async function fetchJSON(url, opts) {
  const r = await fetch(url, opts);
  return r.json();
}

// ── Step 0: Hardware ────────────────────────────────
async function initHardware() {
  const hw = await fetchJSON("/api/wizard/hardware");
  const info = document.getElementById("hw-info");
  info.innerHTML = [
    ["Chip", "Apple " + hw.chip],
    ["RAM", hw.ram_gb + " GB"],
    ["Transcription", "Whisper " + hw.whisper_model],
    ["Summarization", hw.llm_model],
  ].map(([l, v]) => `<div class="info-row"><span class="info-label">${l}</span><span class="info-value">${v}</span></div>`).join("");
}

// ── Step 1: Whisper ─────────────────────────────────
async function initWhisper() {
  const hw = await fetchJSON("/api/wizard/hardware");
  document.getElementById("whisper-subtitle").textContent = `Whisper ${hw.whisper_model}`;

  const status = await fetchJSON("/api/wizard/whisper/status");
  if (status.downloaded) {
    document.getElementById("whisper-progress").style.width = "100%";
    document.getElementById("whisper-status").textContent = "Already downloaded.";
    document.getElementById("whisper-btn").textContent = "Continue";
    document.getElementById("whisper-btn").disabled = false;
    return;
  }

  // Start download
  document.getElementById("whisper-status").textContent = "Loading…";
  fetch("/api/wizard/whisper/download", { method: "POST" });

  // Poll progress
  const poll = setInterval(async () => {
    const p = await fetchJSON("/api/wizard/whisper/progress");
    const pct = p.total > 0 ? Math.round(p.downloaded / p.total * 100) : 0;
    document.getElementById("whisper-progress").style.width = pct + "%";
    if (p.total > 0) {
      document.getElementById("whisper-status").textContent = `Downloading model — ${pct}%`;
    }

    if (p.done) {
      clearInterval(poll);
      document.getElementById("whisper-progress").style.width = "100%";
      document.getElementById("whisper-status").textContent = "Complete";
      document.getElementById("whisper-btn").textContent = "Continue";
      document.getElementById("whisper-btn").disabled = false;
    }
    if (p.error) {
      clearInterval(poll);
      document.getElementById("whisper-status").innerHTML = `<span class="error-text">${p.error}</span>`;
      document.getElementById("whisper-btn").textContent = "Retry";
      document.getElementById("whisper-btn").disabled = false;
      document.getElementById("whisper-btn").onclick = () => { showStep(1); };
    }
  }, 500);
}

// ── Step 2: Ollama ──────────────────────────────────
let _ollamaDetectInterval = null;

async function launchAndWaitForOllama() {
  await fetch("/api/wizard/ollama/launch", { method: "POST" });
  // Wait for Ollama API to become responsive (up to 30s)
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 500));
    try {
      const s = await fetchJSON("/api/wizard/ollama/status");
      if (s.running) {
        await fetch("/api/wizard/focus", { method: "POST" });
        return;
      }
    } catch (e) {}
  }
  await fetch("/api/wizard/focus", { method: "POST" });
}

async function initOllama() {
  if (_ollamaDetectInterval) { clearInterval(_ollamaDetectInterval); _ollamaDetectInterval = null; }

  const hw = await fetchJSON("/api/wizard/hardware");
  document.getElementById("ollama-subtitle").textContent = hw.llm_model;

  const status = await fetchJSON("/api/wizard/ollama/status");

  if (!status.installed) {
    // Show install prompt and poll for installation
    document.getElementById("ollama-install-prompt").style.display = "block";
    document.getElementById("ollama-progress-area").style.display = "none";
    document.getElementById("ollama-btn").style.display = "none";
    document.getElementById("ollama-detect-status").textContent = "Ollama is not installed.";

    document.getElementById("ollama-download-btn").onclick = () => {
      fetch("/api/wizard/ollama/open-download", { method: "POST" });
    };
    document.getElementById("ollama-recheck-btn").onclick = () => {
      document.getElementById("ollama-detect-status").textContent = "Checking…";
      initOllama();
    };

    // Auto-detect every 2 seconds in case user installs it
    _ollamaDetectInterval = setInterval(async () => {
      const s = await fetchJSON("/api/wizard/ollama/status");
      if (s.installed) {
        clearInterval(_ollamaDetectInterval);
        _ollamaDetectInterval = null;
        document.getElementById("ollama-detect-status").textContent = "Ollama detected — launching…";
        await launchAndWaitForOllama();
        initOllama();
      }
    }, 2000);
    return;
  }

  // Ollama is installed — switch to progress view
  document.getElementById("ollama-install-prompt").style.display = "none";
  document.getElementById("ollama-progress-area").style.display = "block";
  document.getElementById("ollama-btn").style.display = "inline-block";

  // Make sure Ollama is actually running before pulling
  if (!status.running) {
    document.getElementById("ollama-status").textContent = "Launching Ollama…";
    await launchAndWaitForOllama();
  }

  // Re-check after ensuring it's running
  const freshStatus = await fetchJSON("/api/wizard/ollama/status");
  if (freshStatus.model_pulled) {
    document.getElementById("ollama-progress").style.width = "100%";
    document.getElementById("ollama-status").textContent = "Already downloaded.";
    document.getElementById("ollama-btn").textContent = "Continue";
    document.getElementById("ollama-btn").disabled = false;
    return;
  }

  // Auto-start model pull
  document.getElementById("ollama-btn").disabled = true;
  document.getElementById("ollama-btn").textContent = "Downloading…";
  document.getElementById("ollama-status").textContent = "Loading…";

  fetch("/api/wizard/ollama/pull", { method: "POST" });

  const poll = setInterval(async () => {
    const p = await fetchJSON("/api/wizard/ollama/progress");
    const pct = p.total > 0 ? Math.round(p.done / p.total * 100) : 0;
    document.getElementById("ollama-progress").style.width = pct + "%";
    if (p.total > 0) {
      document.getElementById("ollama-status").textContent = `Downloading model — ${pct}%`;
    }

    if (p.complete) {
      clearInterval(poll);
      document.getElementById("ollama-progress").style.width = "100%";
      document.getElementById("ollama-status").textContent = "Complete";
      document.getElementById("ollama-btn").textContent = "Continue";
      document.getElementById("ollama-btn").disabled = false;
    }
    if (p.error) {
      clearInterval(poll);
      document.getElementById("ollama-status").innerHTML = `<span class="error-text">${p.error}</span>`;
      document.getElementById("ollama-btn").textContent = "Retry";
      document.getElementById("ollama-btn").disabled = false;
      document.getElementById("ollama-btn").onclick = () => { initOllama(); };
    }
  }, 500);
}

// ── Step 3: Permissions ─────────────────────────────
async function requestPermission() {
  const btn = document.getElementById("perm-btn");
  const status = document.getElementById("perm-status");
  btn.disabled = true;
  status.textContent = "A system dialog should appear…";
  const r = await fetchJSON("/api/wizard/permission", { method: "POST" });
  if (r.granted) {
    status.textContent = "Permission granted.";
    setTimeout(goNext, 600);
  } else {
    status.textContent = "Not granted — you can enable it later in System Settings.";
    btn.disabled = false;
  }
}

// ── Step 4: Launch ──────────────────────────────────
function launch() {
  fetch("/api/wizard/done", { method: "POST" });
}

// Init
renderDots();
initHardware();
</script>
</body>
</html>
